name: build-ipa

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild \
            -project WebcamLink.xcodeproj \
            -scheme WebcamLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WebcamLink.app Payload/
          zip -qry WebcamLink.ipa Payload
          shasum -a 256 WebcamLink.ipa | awk '{print $1}' > WebcamLink.ipa.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebcamLink-ipa
          path: |
            ios/WebcamLink.ipa
            ios/WebcamLink.ipa.sha256

      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/WebcamLink.ipa
            ios/WebcamLink.ipa.sha256
          generate_release_notes: true
