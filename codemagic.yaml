# CI de secours pour l'app iOS quand GitHub Actions est indisponible (quota,
# facturation) : Codemagic propose des runners macOS sur son offre gratuite.
# Importer le dépôt sur codemagic.io, il détecte ce fichier.
#
# Équivalent du job `ios` de .github/workflows/ci.yml : compilation non signée,
# aucune signature, aucun secret.

workflows:
  ios-build:
    name: App iOS (compilation non signée)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: "*"
          include: true
    scripts:
      - name: XcodeGen
        script: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Compilation non signée
        script: |
          cd ios
          xcodebuild \
            -project WebcamLink.xcodeproj \
            -scheme WebcamLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
    artifacts:
      - ios/build/Build/Products/Release-iphoneos/WebcamLink.app
