[package]
name = "wcl-agent"
version = "0.1.0"
edition = "2021"
description = "WebcamLink PC agent — usbmux + WCLN protocol"
license = "MIT"

[lib]
name = "wcl_agent"
path = "src/lib.rs"

[[bin]]
name = "wcl-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "wcl-mkh264"
path = "src/bin/mkh264.rs"

[[bin]]
name = "wcl-fakephone"
path = "src/bin/fakephone.rs"

[[bin]]
name = "wcl-view"
path = "src/bin/view.rs"

[[bin]]
name = "wcl-agent"
path = "src/bin/agent.rs"

[dependencies]
anyhow = "1"
plist = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
