name: WebcamLink
options:
  bundleIdPrefix: com.allan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  WebcamLink:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: WebcamLink
        CFBundleShortVersionString: "0.1.1"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: "WebcamLink utilise la caméra pour l'envoyer à votre PC."
        NSLocalNetworkUsageDescription: "WebcamLink utilise le réseau local pour parler à votre PC."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allan.webcamlink
        PRODUCT_NAME: WebcamLink
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.1.1
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        SWIFT_STRICT_CONCURRENCY: minimal
